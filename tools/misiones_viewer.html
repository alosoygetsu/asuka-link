<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Misiones del Digilog</title>
<!-- Copied next to data.js by tools/misiones.py; it shows what that export read from the game and journal_steps.py. -->
<style>
:root { --bg: #16181d; --panel: #1f2229; --line: #2e323c; --text: #d8dbe2; --dim: #8a90a0; --acc: #f0a640;
        --warn: #e8664f; --info: #6aa7e8; --ok: #6cc070; --chip: #2b2f3a; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px system-ui, sans-serif; display: flex; height: 100vh; }
#side { width: 330px; min-width: 240px; border-right: 1px solid var(--line); display: flex; flex-direction: column; }
#filters { padding: 10px; display: flex; flex-direction: column; gap: 6px; border-bottom: 1px solid var(--line); }
#filters .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
#search { padding: 7px 9px; background: var(--panel); border: 1px solid var(--line); color: var(--text); border-radius: 6px; width: 100%; }
select, button { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 5px; padding: 4px 8px; font: inherit; }
button { cursor: pointer; }
button:hover { border-color: var(--acc); }
button.sel { border-color: var(--acc); color: var(--acc); }
label { color: var(--dim); font-size: 13px; display: flex; gap: 5px; align-items: center; }
#count { color: var(--dim); font-size: 12px; }
#list { overflow-y: auto; flex: 1; }
.group { padding: 8px 10px 4px; color: var(--acc); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
.item { padding: 6px 10px; cursor: pointer; border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: baseline; }
.item:hover { background: var(--panel); }
.item.sel { background: #2b2f3a; border-left: 3px solid var(--acc); padding-left: 7px; }
.item .k { font-family: ui-monospace, monospace; color: var(--dim); font-size: 12px; min-width: 40px; }
.item .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.badge { font-size: 11px; border-radius: 9px; padding: 0 6px; }
.badge.w { background: var(--warn); color: #111; }
.badge.i { background: var(--info); color: #111; }
.badge.ok { color: var(--ok); }
.badge.cur { color: var(--acc); }
#main { flex: 1; overflow-y: auto; padding: 14px 20px 40px; }
h1 { font-size: 20px; margin: 0 0 6px; }
h1 small { color: var(--dim); font: 13px ui-monospace, monospace; margin-left: 8px; }
.meta { color: var(--dim); font-size: 13px; display: grid; grid-template-columns: max-content 1fr; gap: 3px 12px; margin: 8px 0; }
.meta b { color: var(--text); font-weight: 500; }
.desc { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; white-space: pre-line;
        font-family: ui-monospace, monospace; font-size: 13px; display: inline-block; margin: 6px 0; }
.alert { border-left: 3px solid var(--warn); background: #2a1e1c; padding: 5px 10px; margin: 4px 0; border-radius: 3px; }
.alert.info { border-color: var(--info); background: #1c2430; }
a, .link { color: var(--acc); cursor: pointer; text-decoration: none; }
a:hover, .link:hover { text-decoration: underline; }
.step { border: 1px solid var(--line); border-radius: 8px; margin: 10px 0; background: #1a1d23; }
.step.cur { border-color: var(--acc); }
.step .head { display: flex; gap: 10px; align-items: flex-start; padding: 8px 12px; }
.step .num { font: 600 15px ui-monospace, monospace; color: var(--acc); min-width: 22px; }
.step .body { flex: 1; min-width: 0; }
.step .txt { white-space: pre-line; font-family: ui-monospace, monospace; font-size: 13px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 5px; }
.chip { background: var(--chip); border-radius: 4px; padding: 1px 7px; font-size: 12px; font-family: ui-monospace, monospace; }
.chip.flag { color: #e8c86a; } .chip.item { color: #8ad0a0; } .chip.after { color: #b59cf0; } .chip.map { color: #9cc4f0; }
.state { font-size: 15px; min-width: 18px; }
.langs { margin-top: 6px; font-size: 12px; display: grid; grid-template-columns: max-content 1fr; gap: 2px 8px; }
.langs .miss { color: var(--warn); }
.detail { border-top: 1px solid var(--line); padding: 6px 12px 10px 44px; font-size: 13px; }
.who { display: flex; gap: 10px; align-items: flex-start; margin: 6px 0; }
.who canvas { image-rendering: pixelated; background: #2a2d36; border-radius: 4px; flex: none; }
.who .say { color: var(--text); }
.who .src { color: var(--dim); font: 11px ui-monospace, monospace; }
.who.clear { border-left: 3px solid var(--warn); padding-left: 7px; }
.sec { color: var(--dim); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; margin-top: 8px; }
.codes { color: var(--dim); font: 12px ui-monospace, monospace; }
details summary { cursor: pointer; color: var(--dim); font-size: 12px; margin-top: 6px; }
.copy { float: right; font-size: 11px; padding: 1px 6px; }
#stateBar { font-size: 12px; color: var(--dim); }
</style>
</head>
<body>
<div id="side">
  <div id="filters">
    <input id="search" placeholder="Buscar: texto, marca F1A:22, objeto, personaje, mapa 0x220…" autofocus>
    <div class="row">
      <select id="kind"></select>
      <select id="zone"><option value="">Todas las zonas</option></select>
    </div>
    <div class="row">
      <label><input id="onlyWarn" type="checkbox"> Solo con avisos</label>
      <label><input id="withInfo" type="checkbox"> Contar notas</label>
    </div>
    <div class="row" id="langBtns"></div>
    <div id="stateBar"></div>
    <div id="count"></div>
  </div>
  <div id="list"></div>
</div>
<div id="main"></div>
<script src="data.js"></script>
<script>
"use strict";
const D = window.MISIONES;
if (!D) document.body.textContent = "Falta data.js: genera la carpeta con python tools/misiones.py";
const $ = id => document.getElementById(id);
const hex = (n, w = 3) => "0x" + n.toString(16).toUpperCase().padStart(w, "0");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const store = (k, v) => { try { localStorage.setItem("misiones." + k, v); } catch (e) {} };
const load = k => { try { return localStorage.getItem("misiones." + k); } catch (e) { return null; } };
const KINDS = [["", "Todas"], ["historia", "Historia"], ["otras", "Secundarias"], ["ddna", "DDNA"], ["armas", "Armas"],
               ["jefes", "Jefes"], ["cartas", "Cartas"], ["subastas", "Subastas"]];
const KIND_NAME = Object.fromEntries(KINDS);
const S = { lang: +(load("lang") || 0), sel: null };
const byId = Object.fromEntries(D.quests.map(q => [q.id, q]));
const ST = D.state || null;

// ---------------------------------------------------------------- sprites (the sprites viewer's data, if generated)
let SP = null, spByKey = {};
const sheets = {};
function loadSprites() {
  const s = document.createElement("script");
  s.src = "../sprites/data.js";
  s.onload = () => {
    SP = window.SPRITES;
    for (const c of SP.chars) for (const k of c.keys) spByKey[k] = c;
    if (S.sel) show(S.sel, false);
  };
  document.head.appendChild(s);
}
function sheet(file) {
  if (!sheets[file]) { sheets[file] = new Image(); sheets[file].src = "../sprites/" + SP.files[file].sheet; }
  return sheets[file];
}
// The character's standing frame (set 1, or its first), facing down, on a small canvas
function spriteCanvas(key) {
  const c = document.createElement("canvas");
  c.width = c.height = 56;
  const ch = SP && spByKey[key];
  if (!ch) return c;
  const set = ch.sets.find(s => s.id === 1) || ch.sets[0];
  const list = set && set.dirs[0];
  if (!list || !list.steps.length) return c;
  const st = list.steps[0], f = SP.files[set.file].frames[st[1]];
  const img = sheet(set.file);
  const draw = () => {
    const ctx = c.getContext("2d");
    ctx.imageSmoothingEnabled = false;
    const z = Math.min(2, 52 / Math.max(f[2], f[3]));
    ctx.drawImage(img, f[0], f[1], f[2], f[3], (56 - f[2] * z) / 2, 54 - f[3] * z, f[2] * z, f[3] * z);
  };
  if (img.complete && img.naturalWidth) draw(); else img.addEventListener("load", draw);
  c.title = ch.label;
  return c;
}
function charName(key) { return D.chars[key] || ("personaje " + key); }
function charLink(key) {
  const ch = SP && spByKey[key];
  const name = esc(charName(key)) + ` <span class="codes">(${key})</span>`;
  return ch ? `<a href="../sprites/index.html#${encodeURIComponent(ch.label)}" target="_blank">${name}</a>` : name;
}

// ---------------------------------------------------------------- the list
function mapName(m) {
  if (!m) return "";
  const x = D.maps[m];
  return hex(m) + " " + (x ? x.name.split(",")[0] : "?");
}
function zoneOf(q) { const x = D.maps[q.mode]; return x ? x.zone : ""; }
function title(q) { return q.title[S.lang] || q.title[1] || q.id; }
function warnCount(q, info) {
  const n = (q.warn.length + q.steps.reduce((a, s) => a + s.warn.length, 0));
  return info ? n + q.info.length + q.steps.reduce((a, s) => a + s.info.length, 0) : n;
}
function haystack(q) {
  if (q._hay) return q._hay;
  const parts = [q.id, title(q), ...q.title, ...(q.text || []), q.doneText || "", mapName(q.mode), zoneOf(q),
                 q.key != null ? hex(q.key) : "", q.progress != null ? hex(q.progress, 2) : ""];
  for (const s of q.steps) {
    parts.push(s.cond, ...s.text, mapName(s.mode));
    const e = s.ev || {};
    for (const t of [...(e.set || []), ...(e.clear || [])]) parts.push(charName(t.char), t.stage, ...t.say);
    for (const x of e.sites || []) { parts.push(x.where, x.ctx); for (const c of x.chars || []) parts.push(charName(c)); }
    for (const d of e.drops || []) parts.push(d.enemy);
  }
  return (q._hay = parts.join(" ").toLowerCase());
}
function filtered() {
  const words = $("search").value.toLowerCase().split(/\s+/).filter(Boolean);
  const kind = $("kind").value, zone = $("zone").value, onlyWarn = $("onlyWarn").checked;
  return D.quests.filter(q =>
    (!kind || q.kind === kind) && (!zone || zoneOf(q) === zone) && (!onlyWarn || warnCount(q, $("withInfo").checked)) &&
    words.every(w => haystack(q).includes(w)));
}
function stateOf(q) {
  if (!ST) return "";
  if (ST.done[q.id]) return `<span class="badge ok">✓</span>`;
  if (q.type === "historia" && q.progress === ST.progress) return `<span class="badge cur">▶</span>`;
  return "";
}
function renderList() {
  const order = Object.fromEntries(KINDS.map(([v], k) => [v, k]));
  const qs = filtered().map((q, k) => [q, k]).sort((a, b) => (order[a[0].kind] ?? 99) - (order[b[0].kind] ?? 99) || a[1] - b[1]).map(x => x[0]);
  const info = $("withInfo").checked;
  $("count").textContent = `${qs.length} de ${D.quests.length}`;
  const box = $("list");
  box.innerHTML = "";
  let group = null;
  for (const q of qs) {
    const g = q.type === "historia" ? "Historia" : KIND_NAME[q.kind] || q.kind;
    if (g !== group) { group = g; box.insertAdjacentHTML("beforeend", `<div class="group">${esc(g)}</div>`); }
    const w = warnCount(q, false), n = info ? warnCount(q, true) - w : 0;
    const el = document.createElement("div");
    el.className = "item" + (q.id === S.sel ? " sel" : "");
    el.innerHTML = `<span class="k">${q.type === "historia" ? hex(q.progress, 2) : hex(q.key)}</span>` +
      `<span class="t">${esc(title(q))}</span>${stateOf(q)}` +
      (w ? `<span class="badge w">${w}</span>` : "") + (n ? `<span class="badge i">${n}</span>` : "");
    el.onclick = () => show(q.id);
    box.appendChild(el);
  }
}

// ---------------------------------------------------------------- one quest
function chipOf(s) {
  const cls = { flag: "flag", item: "item", ddna: "item", card: "item", after: "after" }[s.kind] || "";
  let label = s.cond;
  if (s.item != null) label += " · " + (D.items[s.item] || [])[S.lang];
  return `<span class="chip ${cls}">${esc(label)}</span>`;
}
function talkRow(t, cls) {
  const div = document.createElement("div");
  div.className = "who" + (cls ? " " + cls : "");
  div.appendChild(spriteCanvas(t.char));
  const say = t.say[S.lang] || t.say[1] || "";
  div.insertAdjacentHTML("beforeend", `<div><div>${charLink(t.char)} · ${esc(t.stage)} ${esc(mapName(t.mode))}</div>` +
    `<div class="say">«${esc(say)}»</div>` +
    `<div class="codes">si [${esc(t.if.join(", "))}] → [${esc(t.do.join(", "))}]` +
    (t.shown.length ? ` · sale si [${esc(t.shown.join(", "))}]` : "") + `</div>` +
    `<div class="src">${esc(t.where)} · charla ${t.talk}</div></div>`);
  return div;
}
function siteRow(x) {
  const div = document.createElement("div");
  div.className = "who" + (x.kind === "clear" ? " clear" : "");
  if (x.chars && x.chars.length) div.appendChild(spriteCanvas(x.chars[0]));
  let html = `<div><div>${x.kind === "clear" ? "<b>la borra</b> " : ""}${esc(x.ctx || "código")}` +
    (x.stage ? ` · ${esc(x.stage)} ${esc(mapName(x.mode))}` : "") + `</div>`;
  if (x.chars && x.chars.length) html += `<div>con ${x.chars.map(charLink).join(", ")}</div>`;
  if (x.lines && x.lines.length) {
    html += x.lines.map((l, i) => `<div class="say">«${esc(l[S.lang] || l[1])}»</div>` +
      (i === 1 && x.count > 4 ? `<div class="codes">… (${x.count} frases)</div>` : "")).join("");
  } else html += `<div class="codes">${esc(x.text)}</div>`;
  html += `<div class="src">${esc(x.where)}</div></div>`;
  div.insertAdjacentHTML("beforeend", html);
  return div;
}
function stepState(q, s, i) {
  if (!ST) return "";
  const v = ST.steps[s.id];
  return v === 1 ? `<span class="state" style="color:var(--ok)" title="hecho en la partida">✓</span>` :
         v === 0 ? `<span class="state" style="color:var(--dim)" title="no hecho">·</span>` :
         `<span class="state" title="no se sabe con un volcado">?</span>`;
}
function currentStep(q) {
  // the Digilog's: the one after the last that holds
  if (!ST || q.done === 0xE000) return -1;
  let last = -1;
  q.steps.forEach((s, i) => { if (ST.steps[s.id] === 1) last = i; });
  return last + 1 < q.steps.length ? last + 1 : -1;
}
function noteText(q, s, i) {
  const lines = [`${title(q)} (${q.type === "historia" ? "historia " + hex(q.progress, 2) : "misión " + hex(q.key)}), paso ${i + 1}/${q.steps.length}`,
    `  condición ${s.cond}, mapa ${mapName(s.mode) || "-"}`,
    `  ES: ${s.text[0].replace(/\n/g, " ")}`, `  EN: ${s.text[1].replace(/\n/g, " ")}`];
  for (const w of s.warn) lines.push("  aviso: " + w);
  return lines.join("\n");
}
function show(id, scroll = true) {
  const q = byId[id];
  if (!q) return;
  S.sel = id;
  store("sel", id);
  if (location.hash.slice(1) !== id) history.replaceState(null, "", "#" + id);
  renderList();
  const m = $("main");
  const L = S.lang;
  let h = `<h1>${esc(title(q))}<small>${q.type === "historia" ? "historia " + hex(q.progress, 2) : "misión " + hex(q.key)}</small></h1>`;
  h += `<div class="meta">`;
  h += `<span>Tipo</span><b>${esc(q.type === "historia" ? "Paso de historia" : (KIND_NAME[q.kind] || q.kind) + (q.origin === "port" ? " · del port" : " · de Asuka Link"))}</b>`;
  h += `<span>Mapa</span><b>${esc(mapName(q.mode) || "—")}${zoneOf(q) ? " · " + esc(zoneOf(q)) : ""}</b>`;
  if (q.type === "historia") {
    if (q.group.length > 1) h += `<span>Lista</span><b>la comparten ${q.group.map(g => `<span class="link" data-go="${g}">${hex(byId[g].progress, 2)}</span>`).join(", ")}</b>`;
  } else {
    h += `<span>Hecha con</span><b>${esc(q.done === 0xE000 ? "todos sus pasos, en cualquier orden" : q.doneText)}</b>`;
    if (q.last) h += `<span>Hasta</span><b>el paso de historia ${hex(q.last, 2)}</b>`;
    if (q.req) h += `<span>Pide antes</span><b>${esc((D.items[q.req] || [])[L])} (${hex(q.req)})</b>`;
    if (q.reward) h += `<span>Recompensa</span><b>${esc((D.items[q.reward] || [])[L])} (${hex(q.reward)})</b>`;
  }
  if (q.needs.length) h += `<span>Depende de</span><b>${q.needs.map(([g, why]) => `<span class="link" data-go="${g}">${esc(title(byId[g]))}</span> <span class="codes">(${esc(why)})</span>`).join(", ")}</b>`;
  if (q.neededBy.length) h += `<span>La necesitan</span><b>${q.neededBy.map(([g, why]) => `<span class="link" data-go="${g}">${esc(title(byId[g]))}</span>`).join(", ")}</b>`;
  if (ST) h += `<span>Partida</span><b>${ST.done[q.id] ? "hecha" : "sin hacer"}</b>`;
  h += `</div>`;
  if (q.text) h += `<div class="desc">${esc(q.text[L])}</div>`;
  for (const w of q.warn) h += `<div class="alert">${esc(w)}</div>`;
  for (const w of q.info) h += `<div class="alert info">${esc(w)}</div>`;
  if (!q.steps.length) h += `<p style="color:var(--dim)">Sin pasos propios en el Digilog.</p>`;
  m.innerHTML = h;
  const cur = currentStep(q);
  q.steps.forEach((s, i) => {
    const box = document.createElement("div");
    box.className = "step" + (i === cur ? " cur" : "");
    let hh = `<div class="head"><span class="num">${i + 1}</span>${stepState(q, s, i)}<div class="body">` +
      `<button class="copy" title="Copia el paso para una nota">copiar</button>` +
      `<div class="txt">${esc(s.text[L])}</div><div class="chips">${chipOf(s)}` +
      (s.mode ? `<span class="chip map">${esc(mapName(s.mode))}</span>` : `<span class="chip">sin mapa</span>`) +
      (s.link && byId[s.link] && s.link !== q.id && !(q.group || []).includes(s.link) ?`<span class="chip link" data-go="${s.link}">→ ${esc(title(byId[s.link]))}</span>` : "") +
      (s.quest && byId[s.quest] ? `<span class="chip link" data-go="${s.quest}">→ misión ${esc(title(byId[s.quest]))}</span>` : "") +
      `</div>`;
    for (const w of s.warn) hh += `<div class="alert">${esc(w)}</div>`;
    for (const w of s.info) hh += `<div class="alert info">${esc(w)}</div>`;
    hh += `<details><summary>Los 5 idiomas</summary><div class="langs">` +
      D.langs.map((l, k) => `<span class="${s.untranslated.includes(l) ? "miss" : ""}">${l}</span><span class="txt">${esc(s.text[k])}</span>`).join("") +
      `</div></details></div></div>`;
    box.innerHTML = hh;
    box.querySelector(".copy").onclick = () => navigator.clipboard && navigator.clipboard.writeText(noteText(q, s, i));
    const e = s.ev;
    if (e) {
      const det = document.createElement("div");
      det.className = "detail";
      const sets = e.set.length + e.sites.filter(x => x.kind === "set").length + e.choices.length;
      det.insertAdjacentHTML("beforeend", `<div class="sec">${s.kind === "flag" ? "La ponen" : "Lo dan"} (${sets})</div>`);
      for (const t of e.set) det.appendChild(talkRow(t));
      for (const x of e.sites.filter(x => x.kind === "set")) det.appendChild(siteRow(x));
      for (const c of e.choices) det.insertAdjacentHTML("beforeend", `<div class="who"><div><div>${esc(c.text)} · ${esc(mapName(c.mode))}</div><div class="src">${esc(c.where)}</div></div></div>`);
      if (e.drops.length) {
        det.insertAdjacentHTML("beforeend", `<div class="sec">Lo sueltan</div>` + e.drops.slice(0, 6).map(d =>
          `<div class="codes">${esc(d.enemy)} ${d.chance}% en ${d.maps.map(([st, mo]) => esc(st + " " + mapName(mo))).join(", ") || "ninguna batalla de mapa"}</div>`).join(""));
      }
      const clears = [...e.clear, ...e.sites.filter(x => x.kind === "clear")];
      if (clears.length) {
        det.insertAdjacentHTML("beforeend", `<div class="sec">${s.kind === "flag" ? "La borran" : "Lo quitan"} (${clears.length})</div>`);
        for (const t of e.clear) det.appendChild(talkRow(t, "clear"));
        for (const x of e.sites.filter(x => x.kind === "clear")) det.appendChild(siteRow(x));
      }
      if (e.test.length) {
        const d = document.createElement("details");
        d.innerHTML = `<summary>La comprueban ${e.test.length}${e.test.length >= 12 ? "+" : ""} charlas</summary>`;
        for (const t of e.test) d.appendChild(talkRow(t));
        det.appendChild(d);
      }
      box.appendChild(det);
    }
    m.appendChild(box);
  });
  for (const el of m.querySelectorAll("[data-go]")) el.onclick = () => show(el.dataset.go);
  if (scroll) m.scrollTop = 0;
}

// ---------------------------------------------------------------- setup
function setup() {
  $("kind").innerHTML = KINDS.map(([v, t]) => `<option value="${v}">${t}</option>`).join("");
  const zones = [...new Set(D.quests.map(zoneOf).filter(Boolean))].sort();
  $("zone").insertAdjacentHTML("beforeend", zones.map(z => `<option>${esc(z)}</option>`).join(""));
  for (const [k, l] of D.langs.entries()) {
    const b = document.createElement("button");
    b.textContent = l;
    b.onclick = () => { S.lang = k; store("lang", k); setup.langs(); renderList(); if (S.sel) show(S.sel, false); };
    $("langBtns").appendChild(b);
  }
  setup.langs = () => [...$("langBtns").children].forEach((b, k) => b.classList.toggle("sel", k === S.lang));
  setup.langs();
  for (const id of ["kind", "zone", "onlyWarn", "withInfo"]) {
    const v = load("f." + id);
    if (v != null) { if ($(id).type === "checkbox") $(id).checked = v === "1"; else $(id).value = v; }
    $(id).onchange = () => { store("f." + id, $(id).type === "checkbox" ? ($(id).checked ? "1" : "0") : $(id).value); renderList(); };
  }
  $("search").oninput = renderList;
  if (ST) $("stateBar").textContent = `Partida: ${ST.name || "?"}, historia ${hex(ST.progress, 2)}, ${ST.money} BIT (${ST.file.split(/[\\/]/).pop()})`;
  renderList();
  const want = location.hash.slice(1) || load("sel");
  show(byId[want] ? want : D.quests[0].id);
  window.onhashchange = () => { const h = location.hash.slice(1); if (byId[h] && h !== S.sel) show(h); };
  loadSprites();
}
if (D) setup();
</script>
</body>
</html>
