# I testi del Digilog in italiano (tools/journal_steps.py): il testo inglese, poi la traduzione. I nomi di luoghi,
# oggetti e carte sono quelli del gioco in italiano. Due righe di 39 lettere al massimo (si tagliano da sole).
# Lettere che il font del gioco non ha: ì, À.
